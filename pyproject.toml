[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "token-burn"
version = "0.9.0"
description = "Token Burn: a local dashboard of token usage and costs for Claude Code, Cursor, opencode and OpenAI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "aenemo" }]
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/aenemo/token-burn"
Repository = "https://github.com/aenemo/token-burn"
Issues = "https://github.com/aenemo/token-burn/issues"

[project.optional-dependencies]
keyring = ["keyring"]

[project.scripts]
token-burn = "token_burn.cli:main"

[tool.setuptools]
packages = ["token_burn", "token_burn.scheduler", "collector", "collector.adapters", "collector.plan", "collector.sync", "token_burn.web"]
py-modules = ["server"]
include-package-data = true

[tool.setuptools.package-dir]
"token_burn.web" = "web"

[tool.setuptools.package-data]
"token_burn.web" = ["*.html", "css/*", "js/**/*", "vendor/*"]
