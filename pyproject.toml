[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ccu"
version = "0.1.0"
description = "Claude Cursor Usage: combined Claude Code and Cursor token usage dashboard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
keyring = ["keyring"]

[project.scripts]
ccu = "ccu.cli:main"

[tool.setuptools]
packages = ["ccu", "ccu.scheduler", "collector", "collector.adapters", "collector.plan", "ccu.web"]
py-modules = ["server"]
include-package-data = true

[tool.setuptools.package-dir]
"ccu.web" = "web"

[tool.setuptools.package-data]
"ccu.web" = ["*.html", "css/*", "js/**/*", "vendor/*"]
