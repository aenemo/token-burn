[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "token-burn"
version = "0.2.0"
description = "Claude Cursor Usage: combined Claude Code and Cursor token usage dashboard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
keyring = ["keyring"]

[project.scripts]
token-burn = "token_burn.cli:main"

[tool.setuptools]
packages = ["token_burn", "token_burn.scheduler", "collector", "collector.adapters", "collector.plan", "collector.sync", "token_burn.web"]
py-modules = ["server"]
include-package-data = true

[tool.setuptools.package-dir]
"token_burn.web" = "web"

[tool.setuptools.package-data]
"token_burn.web" = ["*.html", "css/*", "js/**/*", "vendor/*"]
